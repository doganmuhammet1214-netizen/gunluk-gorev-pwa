<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Checklist icon: checkmark + lines -->
  <g filter="url(#glow)" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Checkmark -->
    <polyline points="8,16 11,19 15,13" stroke-width="2" fill="none"/>
    <!-- Lines -->
    <line x1="17" y1="13" x2="24" y2="13" stroke-width="2"/>
    <line x1="17" y1="16" x2="24" y2="16" stroke-width="2"/>
    <line x1="17" y1="19" x2="24" y2="19" stroke-width="2"/>
  </g>
</svg>